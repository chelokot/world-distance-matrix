[workspace]
resolver = "2"
members = ["crates/dm-core", "crates/dm-build", "crates/dm-server", "crates/dm-bench"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
dm-core = { path = "crates/dm-core" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
panic = "unwind"

[profile.dev]
opt-level = 1
