[package]
name = "dm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dm-core.workspace = true
dm-wire.workspace = true
anyhow.workspace = true
axum = "0.8"
bytemuck.workspace = true
bytes = "1.9"
clap = { workspace = true, features = ["env"] }
prometheus = { version = "0.14", default-features = false }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd", "cors", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
dm-build = { path = "../dm-build" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
flate2 = "1"
